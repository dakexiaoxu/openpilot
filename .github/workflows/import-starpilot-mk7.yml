name: Import StarPilot MK7

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout patch script
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/patch_starpilot_mk7.py
          sparse-checkout-cone-mode: false

      - name: Clone StarPilot
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git config --global core.compression 0
          rm -rf /tmp/starpilot
          ok=0
          for i in 1 2 3 4 5; do
            echo "CLONE_ATTEMPT $i"
            if git clone --progress --depth 1 --single-branch --branch StarPilot \
                https://github.com/firestar5683/StarPilot.git /tmp/starpilot; then
              ok=1
              break
            fi
            echo "CLONE_RETRY $i"
            rm -rf /tmp/starpilot
            sleep 8
          done
          test "$ok" = "1"
          test -f /tmp/starpilot/launch_chffrplus.sh
          echo "CLONE_OK"

      - name: Patch MK7 and push StarPilot branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -u "$GITHUB_WORKSPACE/.github/scripts/patch_starpilot_mk7.py" /tmp/starpilot
          cd /tmp/starpilot
          git config user.name "dakexiaoxu"
          git config user.email "xuxiujun2017@gmail.com"
          # Shallow clones cannot be pushed to another GitHub repo (missing objects).
          # Make a complete single-commit branch from the working tree instead.
          git checkout --orphan StarPilot-mk7
          git add -A
          git status --short | head
          git commit -m "Hardcode MK7 fingerprint, skip AGNOS updater, MQB CAN parsers, and ACB."
          git remote add dakexiaoxu "https://x-access-token:${GH_TOKEN}@github.com/dakexiaoxu/openpilot.git"
          git -c http.postBuffer=524288000 push --force -u dakexiaoxu HEAD:StarPilot
          echo "PUSH_OK"
